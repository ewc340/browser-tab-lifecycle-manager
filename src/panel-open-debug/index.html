<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel open debug</title>
    <style>
      body {
        font-family: ui-monospace, monospace;
        font-size: 13px;
        margin: 16px;
        line-height: 1.4;
      }
      h1 {
        font-family: system-ui, sans-serif;
        font-size: 18px;
      }
      pre {
        background: #f4f4f5;
        padding: 12px;
        border-radius: 8px;
        overflow: auto;
        white-space: pre-wrap;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 12px 0;
      }
      button {
        font-family: system-ui, sans-serif;
        padding: 8px 12px;
        cursor: pointer;
      }
      p.hint {
        font-family: system-ui, sans-serif;
        color: #52525b;
        max-width: 720px;
      }
    </style>
  </head>
  <body>
    <h1>Panel open debug</h1>
    <p class="hint">
      Open this page directly when the keyboard shortcut does not work. Copy the report below
      and share it when reporting Arc issues.
    </p>
    <div class="actions">
      <button type="button" id="refresh">Refresh report</button>
      <button type="button" id="test-tab">Test: open manager tab</button>
      <button type="button" id="test-shortcut-cmd">Test: simulate shortcut handler</button>
      <button type="button" id="open-shortcuts-chrome">Open chrome:// shortcuts</button>
      <button type="button" id="open-shortcuts-arc">Open arc:// shortcuts</button>
    </div>
    <pre id="out">Loading…</pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
